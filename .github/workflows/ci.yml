name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # `@cosmic/shared`'s `package.json` `main`/`types`/`exports` point to
      # `./dist/...`, so downstream typecheck and Vitest cannot resolve
      # types on a fresh checkout until shared has been built once.
      - name: Build shared (for downstream type resolution)
        run: pnpm build:shared
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm -r test --run
      - name: Build
        run: pnpm build
      - name: Prettier check
        run: pnpm format:check

  docker:
    name: docker buildx (${{ matrix.image }})
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

# Local distributed simulation: 1 backend + 3 workers sharing the
# Hyperswarm discovery topic. Worker containers persist Hyperbee/Hypercore
# data across restarts via named volumes per worker (per the
# implementation plan and `docker-and-cicd.mdc`).
#
# Usage:
#   docker compose up --build                    # self-contained DHT (default)
#   P2P_BOOTSTRAP= docker compose up --build     # public Holepunch DHT
#
# Why self-contained by default: when every node lives on the same Docker
# bridge (typical for a laptop demo), the public Holepunch DHT records
# their host-NAT external addresses, and most consumer NAT setups don't
# allow hairpinning back to those addresses from inside the bridge. Result:
# all nodes announce successfully but never receive each other's `'connection'`
# event. Running an in-Compose `dht` bootstrap and pointing every node at
# `dht:49737` keeps DHT announcements on bridge-internal IPs (172.x.x.x),
# which the bridge happily routes between containers.

name: cosmic

services:
  # Self-contained HyperDHT bootstrap node. Reuses the already-built
  # `cosmic/backend:dev` image because it already has `hyperdht` and its
  # native deps (libatomic, rocksdb-native prebuilds) installed — no
  # runtime pnpm-install needed.
  dht:
    image: cosmic/backend:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    networks: [cosmic-net]
    expose:
      - '49737'
    # `cosmic/backend:dev` uses pnpm's isolated node-linker, so package
    # symlinks live next to each workspace package. `hyperdht` is declared
    # in `apps/backend/package.json`, hence its symlink is at
    # `/app/apps/backend/node_modules/hyperdht`. Running `node` from `/app`
    # would resolve only root-hoisted deps and fail with MODULE_NOT_FOUND.
    working_dir: /app/apps/backend
    entrypoint: ['node']
    command:
      - '-e'
      - |
        const HyperDHT = require('hyperdht');
        const dht = new HyperDHT({ port: 49737 });
        dht.ready()
          .then(() => console.log('dht.ready', dht.address()))
          .catch((err) => { console.error('dht.error', err); process.exit(1); });
        const stop = () => dht.destroy().then(() => process.exit(0));
        process.on('SIGINT', stop);
        process.on('SIGTERM', stop);
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: cosmic/backend:dev
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      # Default = bootstrap against the in-Compose `dht` service so all
      # peers discover each other on bridge-internal IPs. Override with
      # `P2P_BOOTSTRAP=` (empty) in the host shell to bypass the local
      # bootstrap and use the public Holepunch DHT instead.
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP-dht:49737}
      STATE_BACKEND: hyperbee
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    ports:
      - '3000:3000'
    volumes:
      - backend-data:/data
    networks: [cosmic-net]
    depends_on: [dht, worker1]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  worker1:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker1
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP-dht:49737}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker1-data:/data
    networks: [cosmic-net]
    depends_on: [dht]
    restart: unless-stopped

  worker2:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker2
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP-dht:49737}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker2-data:/data
    networks: [cosmic-net]
    depends_on: [dht]
    restart: unless-stopped

  worker3:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker3
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP-dht:49737}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker3-data:/data
    networks: [cosmic-net]
    depends_on: [dht]
    restart: unless-stopped

  # Vite-built React SPA served by nginx. Reverse-proxies `/v1`, `/health`,
  # `/metrics`, and `/docs` to the backend service so the bundle uses
  # same-origin URLs (matches the dev-time Vite proxy).
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: cosmic/frontend:dev
    environment:
      BACKEND_UPSTREAM: backend:3000
    ports:
      - '5173:80'
    networks: [cosmic-net]
    depends_on: [backend]
    restart: unless-stopped

networks:
  cosmic-net:
    driver: bridge

volumes:
  backend-data:
  worker1-data:
  worker2-data:
  worker3-data:

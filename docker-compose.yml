# Local distributed simulation: 1 backend + 3 workers sharing the
# Hyperswarm discovery topic. Worker containers persist Hyperbee/Hypercore
# data across restarts via named volumes per worker (per the
# implementation plan and `docker-and-cicd.mdc`).
#
# Usage:
#   docker compose up --build                    # public Holepunch DHT
#   docker compose --profile p2p-local up        # self-contained DHT bootstrap

name: cosmic

services:
  # Optional self-contained HyperDHT bootstrap node. Useful when the public
  # Holepunch DHT is unreachable (CI sandboxes, restricted networks). The
  # service reuses the already-built `cosmic/backend:dev` image because it
  # already has `hyperdht` and its native deps (libatomic, rocksdb-native
  # prebuilds) installed — no runtime pnpm-install needed.
  #
  # Usage:
  #   P2P_BOOTSTRAP=dht:49737 docker compose --profile p2p-local up
  dht:
    image: cosmic/backend:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    profiles: [p2p-local]
    networks: [cosmic-net]
    expose:
      - '49737'
    entrypoint: ["node"]
    command:
      - "-e"
      - |
        const HyperDHT = require('hyperdht');
        const dht = new HyperDHT({ port: 49737 });
        dht.ready()
          .then(() => console.log('dht.ready', dht.address()))
          .catch((err) => { console.error('dht.error', err); process.exit(1); });
        const stop = () => dht.destroy().then(() => process.exit(0));
        process.on('SIGINT', stop);
        process.on('SIGTERM', stop);
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: cosmic/backend:dev
    env_file: .env
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      # Default = no bootstrap → Hyperswarm joins the public Holepunch DHT,
      # matching `docker compose up`'s documented behaviour. Override with
      # `P2P_BOOTSTRAP=dht:49737` in the host shell when running
      # `docker compose --profile p2p-local up` to bind to the in-Compose
      # DHT bootstrap node instead.
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP:-}
      STATE_BACKEND: hyperbee
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    ports:
      - '3000:3000'
    volumes:
      - backend-data:/data
    networks: [cosmic-net]
    depends_on: [worker1]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  worker1:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker1
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP:-}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker1-data:/data
    networks: [cosmic-net]
    restart: unless-stopped

  worker2:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker2
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP:-}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker2-data:/data
    networks: [cosmic-net]
    restart: unless-stopped

  worker3:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: cosmic/worker:dev
    env_file: .env
    environment:
      WORKER_ID: worker3
      P2P_DISCOVERY_TOPIC: ${P2P_DISCOVERY_TOPIC:-}
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP:-}
      DATA_DIR: /data
      NODE_KEYPAIR_PATH: /data/node.keypair
    volumes:
      - worker3-data:/data
    networks: [cosmic-net]
    restart: unless-stopped

  # Vite-built React SPA served by nginx. Reverse-proxies `/v1`, `/health`,
  # `/metrics`, and `/docs` to the backend service so the bundle uses
  # same-origin URLs (matches the dev-time Vite proxy).
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: cosmic/frontend:dev
    environment:
      BACKEND_UPSTREAM: backend:3000
    ports:
      - '5173:80'
    networks: [cosmic-net]
    depends_on: [backend]
    restart: unless-stopped

networks:
  cosmic-net:
    driver: bridge

volumes:
  backend-data:
  worker1-data:
  worker2-data:
  worker3-data:
